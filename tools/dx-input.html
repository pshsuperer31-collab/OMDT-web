<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OMDT 근육 진단 데이터 입력</title>
<style>
  :root{--navy:#002D62;--navy-soft:#4A5A8C;--gold:#FFD700;--line:#e3e6ee;--ink:#1c2333;--muted:#69728a;--muscle:#1d9e75;--warn:#C4546B;--con:#3f7bd6;--str:#c2703a}
  *{box-sizing:border-box}
  body{margin:0;background:#f5f6f8;color:var(--ink);font-family:system-ui,"Malgun Gothic",sans-serif;line-height:1.5}
  .wrap{max-width:1060px;margin:0 auto;padding:16px 16px 60px}
  h1{font-size:17px;color:var(--navy);text-align:center;margin:0 0 2px}
  .sub{text-align:center;color:var(--muted);font-size:12px;margin:0 0 12px}
  .topbar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .topbar select{padding:8px 12px;border:1.5px solid var(--navy);border-radius:10px;font:inherit;font-size:13px;font-weight:700;color:var(--navy);background:#fff;cursor:pointer}
  .topbar .stat{font-size:11.5px;color:var(--muted)}
  .langsw{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
  .langsw button{border:0;background:#fff;font:inherit;font-size:11.5px;font-weight:700;color:#3a4260;padding:6px 10px;cursor:pointer}
  .langsw button.on{background:var(--navy);color:#fff}
  .typesw{display:inline-flex;border:1.5px solid var(--muscle);border-radius:8px;overflow:hidden}
  .typesw button{border:0;background:#fff;font:inherit;font-size:12.5px;font-weight:700;color:#3a4260;padding:7px 14px;cursor:pointer}
  .typesw button.on{background:var(--muscle);color:#fff}
  .split{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
  @media(max-width:780px){.split{grid-template-columns:1fr}}
  .mlist{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;max-height:78vh;overflow:auto}
  .mlist button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-bottom:4px;padding:7px 10px;border:1.5px solid var(--line);background:#fbfcfe;border-radius:9px;font:inherit;font-size:12.5px;cursor:pointer;color:#3a4260}
  .mlist button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
  .mlist button.done{border-color:var(--muscle)}
  .mlist button.done .tk{color:var(--muscle)}
  .mlist button.on.done .tk{color:var(--gold)}
  .mlist .tk{font-size:11px;opacity:.85}
  .form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .form.empty{color:var(--muted);text-align:center;padding:50px 20px}
  .form h2{margin:0 0 2px;font-size:18px;color:var(--navy)}
  .form .reg{font-size:12px;color:var(--muted);margin-bottom:14px}
  .fld{margin-bottom:15px}
  .fld>label{display:block;font-weight:700;font-size:12.5px;color:#2a3350;margin-bottom:6px}
  .fld>label .h{font-weight:400;color:var(--muted);font-size:11px}
  .fld input[type=text],.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:12.5px;color:var(--ink)}
  .fld textarea{resize:vertical;min-height:52px}
  .fld input:focus,.fld textarea:focus{outline:none;border-color:var(--navy-soft)}
  .moves{display:flex;flex-wrap:wrap;gap:6px}
  .moves label{border:1.5px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;user-select:none;color:#3a4260;background:#fbfcfe}
  .moves label input{display:none}
  .moves.con label.on{background:var(--con);border-color:var(--con);color:#fff;font-weight:700}
  .moves.str label.on{background:var(--str);border-color:var(--str);color:#fff;font-weight:700}
  .moves.seg label{min-width:34px;justify-content:center;text-align:center}
  .moves.seg label.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:620px){.twocol{grid-template-columns:1fr}}
  .conlab{color:var(--con)} .strlab{color:var(--str)}
  .actions{display:flex;gap:8px;margin-top:6px}
  .actions button{flex:1;padding:10px 0;border:0;border-radius:10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  .btn-save{background:var(--muscle);color:#fff}
  .btn-exp{background:var(--navy);color:#fff}
  textarea#out{width:100%;margin-top:10px;height:120px;font-family:ui-monospace,monospace;font-size:11px;display:none}
  .muscimg-wrap{position:relative;width:100%;max-width:330px;margin:0 auto 15px;background:#fbfcfe;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .muscimg-wrap img{width:100%;display:block}
  .muscimg-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .muscimg-wrap .mg-cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,45,98,.82);color:#fff;font-size:11.5px;font-weight:700;text-align:center;padding:4px}
  .mg-glow{fill:var(--warn);opacity:.5;mix-blend-mode:multiply}
  .mg-pin{fill:#a01d10;stroke:var(--gold);stroke-width:2.5}
  .mg-lead{stroke:var(--warn);stroke-width:1.5;opacity:.7}
  .mg-lb{font-size:13px;font-weight:800;fill:#8a1a10;paint-order:stroke;stroke:#fff;stroke-width:3.5px}
  .noimg{max-width:330px;margin:0 auto 14px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;background:#fafbfc;color:var(--muted);font-size:11.5px;text-align:center;line-height:1.5}
  .rootbox{background:#eef7fc;border:1px solid #cfe6f5;border-left:4px solid var(--con);border-radius:0 10px 10px 0;padding:10px 13px;margin-bottom:15px}
  .rootbox .rt-h{font-weight:800;font-size:12.5px;color:#1d6b9e;margin-bottom:4px}
  .rootbox .rt-tx{font-size:12.5px;color:#123f5e;line-height:1.5}
  .rootbox .rt-d{font-size:11.5px;color:var(--muted);margin-top:4px}
  .okrow{display:flex;align-items:center;gap:7px;font-size:13px;padding:9px 11px;background:#f0f9f4;border:1px solid #cdeadb;border-radius:9px;cursor:pointer;margin-top:4px}
  .okrow input{width:16px;height:16px}
  .saved{font-size:11px;color:var(--muscle);text-align:center;height:14px;margin-top:4px}
  .note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>OMDT 근육 진단 데이터 입력</h1>
  <p class="sub">근육 고르고 → 진단 정보 입력 · 자동 저장 · 부분만 채워도 됨</p>
  <div class="topbar">
    <span class="typesw" id="typesw"><button data-t="muscle" class="on">근육</button><button data-t="nerve">신경</button><button data-t="lig">인대</button></span>
    <select id="regSel"></select>
    <span class="langsw" id="langsw"><button data-l="ko" class="on">한글</button><button data-l="en">EN</button><button data-l="ab">약어</button></span>
    <span class="stat" id="stat"></span>
    <button class="btn-exp" id="btnExport" style="padding:7px 12px;border-radius:9px;border:0;color:#fff;background:var(--navy);cursor:pointer;font:inherit;font-weight:700;font-size:12px">📋 복사</button>
    <button class="btn-save" id="btnSave" style="padding:7px 12px;border-radius:9px;border:0;color:#fff;background:var(--muscle);cursor:pointer;font:inherit;font-weight:700;font-size:12px">💾 전체 저장</button>
  </div>
  <div class="split">
    <div class="mlist" id="mlist"></div>
    <div class="form empty" id="form">← 왼쪽에서 근육을 선택하세요</div>
  </div>
  <textarea id="out" readonly></textarea>
  <p class="note">모든 항목 선택 입력이에요 — 아는 것부터 채우시면 됩니다. 자동 저장되고, 다 하시면 <b>💾 전체 저장</b>으로 <b>omdt-dx.json</b> 받아 채팅에 올려주세요.</p>
</div>

/* 근육의 분절 태그 → 근본(신경근) 치료 대상 자동 도출 */
function rootTarget(seg){
 if(!seg||!seg.length)return null;
 const cerv=seg.filter(s=>/^C/.test(s)||s==='T1');
 const lumbo=seg.filter(s=>/^[LS]/.test(s));
 const thor=seg.filter(s=>/^T([2-9]|1[0-2])$/.test(s));
 const P=[];
 if(cerv.length)P.push(`경추 ${cerv[0]}–${cerv[cerv.length-1]} 방척추근(경다열근·반극근·회선근)·협척혈, 추간공 확인`);
 if(thor.length)P.push(`흉추 ${thor[0]}–${thor[thor.length-1]} 방척추근·늑간`);
 if(lumbo.length)P.push(`요천추 ${lumbo[0]}–${lumbo[lumbo.length-1]} 방척추근(다열근·척추기립근·회선근)·협척혈, 신경근 출구 확인`);
 const derm=seg.map(s=>SEG_REF[s]?`${s}(${SEG_REF[s]})`:'').filter(Boolean).join(' · ');
 return {tx:P.join(' / '),derm};
}

  if(t==='lig')return {link:'',fn:'',sx:'',tests:'',tx:'',ddx:'',ok:false};
  return {nerve:'',seg:[],con:[],str:[],ploc:'',tests:'',tx:'',ddx:'',ok:false};

/* 신경 → 지배 근육 자동 도출 (근육 데이터 기반) */
function nerveMuscles(nn){
  const info=NERVE_DB[nn];if(!info)return [];
  const out=[];
  Object.values(MUSCLES).flat().forEach(m=>{
    if(info.kind==='root'){ if((SUGGEST_MYO[m]||[]).includes(info.root))out.push(m); }
    else { const nv=SUGGEST_NERVE[m]||''; if(info.match&&nv.includes(info.match))out.push(m); }
  });
  if(info.through&&!out.includes(info.through))out.push(info.through);
  (info.extra||[]).forEach(m=>{if(!out.includes(m))out.push(m);});
  return [...new Set(out)];
}
/* 최초 1회: 근육·신경·인대 표준 씨앗 (검수 전 ok:false, 빈 항목만 채움) */
function seedAll(){
  Object.values(MUSCLES).flat().forEach(m=>{
    const e=SEED_DB[m]||{},raw=localStorage.getItem(KEY(m,'muscle'));
    if(!raw){save(m,{nerve:SUGGEST_NERVE[m]||'',seg:(SUGGEST_MYO[m]||[]).slice(),con:e.con?e.con.slice():[],str:[],ploc:e.ploc||'',tests:e.tests||'',tx:e.tx||'',ddx:'',ok:false},'muscle');return;}
    const d=JSON.parse(raw);let ch=false;
    if(!d.nerve&&SUGGEST_NERVE[m]){d.nerve=SUGGEST_NERVE[m];ch=true;}
    if((!d.seg||!d.seg.length)&&SUGGEST_MYO[m]){d.seg=SUGGEST_MYO[m].slice();ch=true;}
    if((!d.con||!d.con.length)&&e.con&&e.con.length){d.con=e.con.slice();ch=true;}
    if(!d.ploc&&e.ploc){d.ploc=e.ploc;ch=true;}
    if(!d.tests&&e.tests){d.tests=e.tests;ch=true;}
    if(!d.tx&&e.tx){d.tx=e.tx;ch=true;}
    if(d.str==null){d.str=[];ch=true;}
    if(d.ok==null){d.ok=false;ch=true;}
    if(ch)save(m,d,'muscle');
  });
  Object.values(NERVES).flat().forEach(n=>{
    const e=NERVE_DB[n]||{},raw=localStorage.getItem(KEY(n,'nerve'));
    if(!raw){save(n,{origin:e.origin||'',derm:e.derm||'',reflex:e.reflex||'',entrap:e.entrap||'',sx:e.sx||'',tests:e.tests||'',tx:e.tx||'',ddx:'',ok:false},'nerve');return;}
    const d=JSON.parse(raw);let ch=false;['origin','derm','reflex','entrap','sx','tests','tx'].forEach(k=>{if(!d[k]&&e[k]){d[k]=e[k];ch=true;}});if(d.ok==null){d.ok=false;ch=true;}if(ch)save(n,d,'nerve');
  });
  Object.values(LIGS).flat().forEach(l=>{
    const e=LIG_DB[l]||{},raw=localStorage.getItem(KEY(l,'lig'));
    if(!raw){save(l,{link:e.link||'',fn:e.fn||'',sx:e.sx||'',tests:e.tests||'',tx:e.tx||'',ddx:'',ok:false},'lig');return;}
    const d=JSON.parse(raw);let ch=false;['link','fn','sx','tests','tx'].forEach(k=>{if(!d[k]&&e[k]){d[k]=e[k];ch=true;}});if(d.ok==null){d.ok=false;ch=true;}if(ch)save(l,d,'lig');
  });
}

  $('form').innerHTML=`
    <h2>${nm(cur)}</h2><div class="reg">인대 · ${REGKO[reg]}</div>
    <div class="fld"><label>연결 부위</label><input type="text" id="l-link" value="${esc(d.link)}" placeholder="예: 후두골 ~ C7 극돌기"></div>
    <div class="fld"><label>기능</label><input type="text" id="l-fn" value="${esc(d.fn)}" placeholder="예: 경부 후방 지지·과굴곡 제한"></div>
    <div class="fld"><label>증상 <span class="h">손상·불안정</span></label><textarea id="l-sx">${d.sx||''}</textarea></div>
    <div class="fld"><label>불안정 · 손상 검사</label><textarea id="l-tests">${d.tests||''}</textarea></div>
    <div class="fld"><label>치료 포인트 <span class="h">약침·프롤로·안정화</span></label><textarea id="l-tx">${d.tx||''}</textarea></div>
    <div class="fld"><label>감별·메모</label><textarea id="l-ddx">${d.ddx||''}</textarea></div>
    <label class="okrow"><input type="checkbox" id="f-ok" ${d.ok?'checked':''}> <b>이 항목 검수 완료</b></label>
    <div class="saved" id="saved"></div>`;
  bindForm(()=>({link:v('l-link'),fn:v('l-fn'),sx:v('l-sx'),tests:v('l-tests'),tx:v('l-tx'),ddx:v('l-ddx'),ok:$('f-ok').checked}),'lig');
}
function bindForm(collect,t){
  const flush=()=>{save(cur,collect(),t);flashSaved();buildReg();markDone();updateStat();};
  $('form').querySelectorAll('input[type=text],textarea').forEach(el=>el.addEventListener('input',flush));
  $('f-ok').addEventListener('change',()=>{flush();buildList();});
}
function renderMuscleForm(){
  const d=load(cur,'muscle');
  $('form').className='form';
  $('form').innerHTML=`
    <div id="muscImg"></div>
    <h2>${nm(cur)}</h2><div class="reg">${nm(cur)!==cur?cur+' · ':''}${REGKO[reg]}${NAMES[cur]&&NAMES[cur].en&&lang!=='en'?' · '+NAMES[cur].en:''}</div>
    <div class="fld"><label>신경 지배 <span class="h">신경명</span></label>
      <input type="text" id="f-nerve" value="${(d.nerve||'').replace(/"/g,'&quot;')}" placeholder="예: 견갑상신경"></div>
    <div class="fld"><label>🧬 신경근 분절 <span class="h">myotome — 말초↔중추 연쇄의 열쇠</span>${segHint(cur,d.seg||[])}</label>
      <div class="moves seg" data-k="seg">${segChips(d.seg||[])}</div></div>
    <div id="rootBox"></div>
    <div class="twocol">
      <div class="fld"><label class="conlab">🔵 수축통 유발 동작 <span class="h">저항 수축 시 아픔</span></label><div class="moves con" data-k="con">${moveChips('con',d.con||[])}</div></div>
      <div class="fld"><label class="strlab">🟠 신장통 유발 동작 <span class="h">늘일 때 아픔</span></label><div class="moves str" data-k="str">${moveChips('str',d.str||[])}</div></div>
    </div>
    <div class="fld"><label>통증·연관통 위치</label>
      <input type="text" id="f-ploc" value="${(d.ploc||'').replace(/"/g,'&quot;')}" placeholder="예: 견갑 내측연, 상완 후외측 방사"></div>
    <div class="fld"><label>이학적 검사 <span class="h">검사명 → 양성 소견</span></label>
      <textarea id="f-tests" placeholder="예: Empty can(Jobe) 저항 외전+내회전 시 통증·근력저하">${d.tests||''}</textarea></div>
    <div class="fld"><label>치료 포인트 <span class="h">자침·약침점, 도수 방향, 우선순위</span></label>
      <textarea id="f-tx" placeholder="예: 극상근 압통점 자침, 견봉하 약침. 상부승모근 이완 병행">${d.tx||''}</textarea></div>
    <div class="fld"><label>감별·메모</label>
      <textarea id="f-ddx" placeholder="예: 경추 C5 신경근병증과 감별 — 방사·감각저하 동반 여부">${d.ddx||''}</textarea></div>
    <label class="okrow"><input type="checkbox" id="f-ok" ${d.ok?'checked':''}> <b>이 근육 검수 완료</b> <span class="h">표준값 확인함</span></label>
    <div class="saved" id="saved"></div>`;
  renderRoot();renderImg();
  // 입력 바인딩
  const collect=()=>{
    const g=id=>$(id)?.value||'';
    return {nerve:g('f-nerve'),ploc:g('f-ploc'),tests:g('f-tests'),tx:g('f-tx'),ddx:g('f-ddx'),ok:$('f-ok')?.checked||false,
      seg:[...$('form').querySelectorAll('[data-k="seg"] input:checked')].map(i=>i.value),
      con:[...$('form').querySelectorAll('[data-k="con"] input:checked')].map(i=>i.value),
      str:[...$('form').querySelectorAll('[data-k="str"] input:checked')].map(i=>i.value)};
  };
  const flush=()=>{save(cur,collect());$('saved').textContent='✓ 저장됨';setTimeout(()=>{if($('saved'))$('saved').textContent='';},900);buildReg();markDone();updateStat();renderRoot();};
  $('form').querySelectorAll('input[type=text],textarea').forEach(el=>el.addEventListener('input',flush));
  $('form').querySelectorAll('.moves input').forEach(el=>el.addEventListener('change',e=>{e.target.closest('label').classList.toggle('on',e.target.checked);flush();}));
  $('f-ok').addEventListener('change',()=>{flush();buildList();});
  const am=$('applyMyo');if(am)am.onclick=()=>{const d2=load(cur);d2.seg=(SUGGEST_MYO[cur]||[]).slice();save(cur,d2);renderForm();buildList();};
  updateStat();
}
function renderImg(){
  const box=$('muscImg');if(!box)return;
  const d=IMGDATA[cur];
  if(!d){box.innerHTML=`<div class="noimg">🖼 그림 좌표 미보정 — <b>calib.html</b>에서 이 근육을 찍으면 여기 표시됩니다</div>`;return;}
  const X=d.x*1000,Y=d.y*1000, MX=(2*IMG_MID-d.x)*1000, lx=X<500?X+28:X-28, anc=X<500?'start':'end';
  box.innerHTML=`<div class="muscimg-wrap">
    <img src="${d.img}" alt="${cur}"/>
    <svg viewBox="0 0 1000 1000" preserveAspectRatio="none">
      <circle class="mg-glow" cx="${X}" cy="${Y}" r="60"/>
      <circle class="mg-glow" cx="${MX}" cy="${Y}" r="60"/>
      <circle class="mg-pin" cx="${MX}" cy="${Y}" r="12"/>
      <circle class="mg-pin" cx="${X}" cy="${Y}" r="13"/>
      <line class="mg-lead" x1="${X}" y1="${Y}" x2="${lx}" y2="${Y-4}"/>
      <text class="mg-lb" x="${lx}" y="${Y+4}" text-anchor="${anc}">${cur}</text>
    </svg>
    <div class="mg-cap">${cur} · 치료 부위</div>
  </div>`;
}
function renderRoot(){
  const box=$('rootBox');if(!box)return;
  const seg=[...$('form').querySelectorAll('[data-k="seg"] input:checked')].map(i=>i.value);
  const rt=rootTarget(seg);
  box.innerHTML=rt?`<div class="rootbox"><div class="rt-h">🎯 근본(신경근) 치료 대상 <span class="h">— 이 분절 자동 도출</span></div><div class="rt-tx">${rt.tx}</div><div class="rt-d">피부분절: ${rt.derm}</div></div>`:'';
}
function markDone(){const b=$('mlist').querySelector(`button[data-m="${cur}"]`);if(b){b.classList.toggle('done',isOk(cur));b.querySelector('.tk').textContent=isOk(cur)?'●':'◐';}}
function updateStat(){
  let tot=0,ok=0;Object.values(LISTS[type]).flat().forEach(m=>{tot++;if(isOk(m))ok++;});
  $('stat').textContent=`${TYPEKO[type]} 검수 ${ok}/${tot}`;
}
function collectAll(){
  const all={muscle:{},nerve:{},lig:{}};
  Object.entries(MUSCLES).forEach(([r,ms])=>ms.forEach(m=>{if(isSeeded(m,'muscle'))all.muscle[m]={region:r,...load(m,'muscle')};}));
  Object.entries(NERVES).forEach(([r,ns])=>ns.forEach(n=>{if(isSeeded(n,'nerve'))all.nerve[n]={region:r,...load(n,'nerve')};}));
  Object.entries(LIGS).forEach(([r,ls])=>ls.forEach(l=>{if(isSeeded(l,'lig'))all.lig[l]={region:r,...load(l,'lig')};}));
  return all;
}
$('regSel').onchange=e=>{reg=e.target.value;cur=null;buildList();renderForm();updateStat();};
$('typesw').querySelectorAll('button').forEach(b=>b.onclick=()=>{type=b.dataset.t;cur=null;$('typesw').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));buildReg();buildList();renderForm();updateStat();});
$('langsw').querySelectorAll('button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;$('langsw').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));buildList();renderForm();});
$('btnExport').onclick=()=>{const t=$('out');t.style.display='block';t.value=JSON.stringify(collectAll(),null,1);t.focus();t.select();try{navigator.clipboard.writeText(t.value);}catch(e){}};
$('btnSave').onclick=()=>{const blob=new Blob([JSON.stringify(collectAll(),null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='omdt-dx.json';document.body.appendChild(a);a.click();a.remove();};
seedAll();buildReg();buildList();renderForm();updateStat();
</script>
</body>
</html>
